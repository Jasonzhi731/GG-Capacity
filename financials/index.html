<style>
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface-2:#eef1f4; --ink:#101920; --ink-2:#46525e; --muted:#7f8b97;

  --cond:"IBM Plex Sans Condensed","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#0b1014; --surface:#131a20; --surface-2:#1a232b; --ink:#edf1f4; --ink-2:#b2bcc6; --muted:#7c8894;

}
:root[data-theme="dark"]{color-scheme:dark;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:24px 64px}
a{color:var(--accent)}
h1,h2,h3{text-wrap:balance;margin:0}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* masthead */
.mast{display:grid;grid-template-columns:1fr auto;gap:12px 24px;align-items:end;padding-bottom:18px;border-bottom:2px solid var(--ink)}
.mast h1{font-family:var(--cond);font-weight:700;font-size:clamp(28px,4.6vw,44px);letter-spacing:.01em;line-height:1.05}
.mast h1 small{display:block;font-family:var(--sans);font-weight:500;font-size:14px;color:var(--ink-2);letter-spacing:0;margin-top:6px}
.stamp{font-family:var(--mono);font-size:12px;color:var(--ink-2);text-align:right;line-height:1.7}
.stamp b{color:var(--ink);font-weight:600}
.disclaim{margin:10px 0 0;font-size:12px;color:var(--muted)}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;flex-wrap:wrap;padding-block:12px;border-bottom:1px solid var(--line)}
.nav button{font:inherit;font-size:13px;font-weight:500;color:var(--ink-2);background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 12px;cursor:pointer}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.nav .sep{width:1px;background:var(--line);margin:4px 6px}
.nav button:focus-visible,.qsel button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

section.view{padding-top:22px;display:grid;gap:22px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 20px}
.head h2{font-family:var(--cond);font-weight:700;font-size:26px}
.head .sub{color:var(--ink-2);font-size:13px}
.lede{color:var(--ink-2);max-width:78ch;margin:0}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:2px;align-content:start}
.kpi .k{font-size:12px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.kpi .v{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.01em}
.kpi .v small{font-size:13px;font-weight:500;color:var(--ink-2);margin-left:3px}
.kpi .d{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.up{color:var(--up)} .down{color:var(--down)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:grid;gap:12px;min-width:0;align-content:start}
.panel h3{font-size:15px;font-weight:700}
.panel .cap{font-size:12px;color:var(--muted)}
.ptitle{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}

/* source badges */
.src{font-size:11px;font-weight:500;border-radius:4px;padding:0 5px;line-height:18px;border:1px solid currentColor;white-space:nowrap}
.src.off{color:var(--off)} .src.calc{color:var(--calc)} .src.est{color:var(--est)}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend i.ln{height:2px;width:14px;border-radius:1px}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:10.5px}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .bl{stroke:var(--axis);stroke-width:1}
.chart .hl{fill:var(--ink);opacity:.06}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.14);min-width:150px;max-width:260px}
.tip b{display:block;font-family:var(--mono);margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:12px;align-items:center}
.tip .r span:first-child{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.tip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.tip .r span:last-child{font-family:var(--mono)}

/* tables */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink-2);font-size:12px;background:var(--surface-2);position:sticky;top:0}
td{font-family:var(--mono);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:inherit;font-family:var(--sans)}
tbody tr{background:var(--surface)}
tbody tr:hover{background:var(--surface-2)}
tr.out td{color:var(--muted)}
td.latest,th.latest{background:var(--accent-soft)}
td .bar{display:inline-block;height:8px;border-radius:0 2px 2px 0;background:var(--accent);vertical-align:middle;margin-right:8px}
td.name{font-weight:500}
td.name small{display:block;color:var(--muted);font-size:11px;font-weight:400;white-space:normal;max-width:260px}
.rk{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface-2);font-family:var(--mono);font-size:12px;font-weight:600;margin-right:8px}
.heat td.h{color:var(--ink)}

.qsel{display:flex;flex-wrap:wrap;gap:4px}
.qsel button{font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:5px;padding:4px 9px;cursor:pointer}
.qsel button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:12px 14px;display:grid;gap:4px}
.note b{color:var(--ink)}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:grid;gap:4px}
@media (max-width:560px){.mast{grid-template-columns:1fr}.stamp{text-align:left}.kpi .v{font-size:21px}}
@media (prefers-reduced-motion:no-preference){.chart rect.m,.chart path.m{transition:opacity .15s}}
</style>
</head>

const $ = (s, r=document) => r.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const Q = DATA.quarters, L = Q.length - 1;
const CO_COLOR = {TSMC:'--s1', UMC:'--s2', SMIC:'--s3', VIS:'--s4', PSMC:'--s5'};
const CO_ORDER = ['TSMC','UMC','VIS','PSMC','SMIC'];
const SRC_L = {off:'官方', calc:'計算', est:'估計'};
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt = (v, d=0) => v == null || isNaN(v) ? '—' : Number(v).toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
const pct = (v, d=1) => v == null || isNaN(v) ? '—' : (v >= 0 ? '+' : '') + (v*100).toFixed(d) + '%';
const chg = (a, b) => (a == null || b == null || !b) ? null : a/b - 1;
const cls = v => v == null ? '' : v >= 0 ? 'up' : 'down';
const badge = s => s ? `<span class="src ${s}">${SRC_L[s]}</span>` : '';
const qlabel = q => q; // e.g. 2Q26

/* ---------- tooltip ---------- */
const tip = $('#tip');
function showTip(e, html){ tip.innerHTML = html; tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight; let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px'; }
const hideTip = () => { tip.hidden = true; };

/* ---------- chart engine (one scale per chart, no dual axes) ---------- */
function niceStep(v){ if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v/p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function scale(lo, hi, n=5){ if (hi <= lo) hi = lo + 1; const step = niceStep((hi - lo)/n);
  const min = Math.floor(lo/step + 1e-9)*step, max = Math.ceil(hi/step - 1e-9)*step; const t = [];
  for (let v = min; v <= max + step/2; v += step) t.push(+v.toFixed(10)); return {min, max, t}; }
function shortNum(v){ const a = Math.abs(v); return a >= 1e4 ? (v/1e3).toFixed(a >= 1e5 ? 0 : 1).replace(/\.0$/,'') + 'k' : a >= 100 ? fmt(v) : +v.toFixed(2) + ''; }

/* opts: {quarters, series:[{name,color,values}], type:'bar'|'stack'|'line', unit, dec, height, yMin} */
function chart(el, o){
  const W = 640, H = o.height || 240, m = {l:46, r:12, t:12, b:26};
  const qs = o.quarters, n = qs.length, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const vals = o.series.flatMap(s => s.values.filter(v => v != null));
  let hi = o.type === 'stack' ? Math.max(...qs.map((_, i) => o.series.reduce((a, s) => a + Math.max(0, s.values[i] || 0), 0))) : Math.max(...vals);
  let lo = o.yMin ?? Math.min(0, ...vals);
  if (o.yMax != null) hi = o.yMax;
  const sc = scale(lo, hi), min = o.yMin ?? sc.min, max = o.yMax ?? sc.max, tk = sc.t.filter(t => t >= min - 1e-9 && t <= max + 1e-9);
  const y = v => m.t + ih - (v - min) / (max - min) * ih;
  const bw = iw / n, x = i => m.l + bw * i + bw/2;
  let g = '';
  for (const t of tk) g += `<line class="gl" x1="${m.l}" x2="${W-m.r}" y1="${y(t)}" y2="${y(t)}"/><text x="${m.l-6}" y="${y(t)+3.5}" text-anchor="end">${shortNum(t)}</text>`;
  const every = n > 14 ? 4 : n > 8 ? 2 : 1;
  qs.forEach((q, i) => { if ((n-1-i) % every === 0) g += `<text x="${x(i)}" y="${H-8}" text-anchor="middle">${q}</text>`; });
  let marks = '';
  if (o.type === 'line') {
    for (const s of o.series) {
      let d = '', pen = false;
      s.values.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1); pen = true; });
      marks += `<path class="m" d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      const li = s.values.map((v, i) => v == null ? -1 : i).filter(i => i >= 0).pop();
      if (li != null && li >= 0) marks += `<circle cx="${x(li)}" cy="${y(s.values[li])}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
    }
    if (min < 0) marks += `<line class="bl" x1="${m.l}" x2="${W-m.r}" y1="${y(0)}" y2="${y(0)}"/>`;
  } else {
    const k = o.type === 'bar' ? o.series.length : 1, gap = 2, inner = Math.max(2, bw * (n > 16 ? .72 : .6)), sw = (inner - gap*(k-1)) / k;
    qs.forEach((_, i) => {
      let acc = 0;
      o.series.forEach((s, j) => { const v = s.values[i]; if (v == null) return;
        let x0, y0, y1;
        if (o.type === 'stack') { x0 = x(i) - inner/2; y0 = y(acc + v); y1 = y(acc); acc += v; }
        else { x0 = x(i) - inner/2 + j*(sw+gap); y0 = y(Math.max(v, 0)); y1 = y(Math.min(v, 0)); }
        const w = o.type === 'stack' ? inner : sw, h = Math.max(0, y1 - y0 - (o.type === 'stack' ? 1 : 0));
        marks += `<rect class="m" x="${x0.toFixed(1)}" y="${y0.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(2, w/3)}" fill="${s.color}"/>`;
      });
    });
    marks += `<line class="bl" x1="${m.l}" x2="${W-m.r}" y1="${y(Math.max(min,0))}" y2="${y(Math.max(min,0))}"/>`;
  }
  const hit = qs.map((q, i) => `<rect data-i="${i}" x="${m.l + bw*i}" y="${m.t}" width="${bw}" height="${ih}" fill="transparent"/>`).join('');
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || '')}">${g}<rect class="hl" id="hl" x="0" y="${m.t}" width="${bw}" height="${ih}" visibility="hidden"/>${marks}${hit}</svg>`;
  const svg = el.firstChild, hl = svg.querySelector('#hl');
  svg.addEventListener('mousemove', e => { const r = e.target.closest('[data-i]'); if (!r) return; const i = +r.dataset.i;
    hl.setAttribute('x', m.l + bw*i); hl.setAttribute('visibility', 'visible');
    let rows = o.series.slice().reverse().map(s => `<div class="r"><span><i style="background:${s.color}"></i>${esc(s.name)}</span><span>${fmt(s.values[i], o.dec ?? 0)}</span></div>`).join('');
    if (o.type === 'stack' && o.series.length > 1) rows += `<div class="r"><span>合計</span><span>${fmt(o.series.reduce((a, s) => a + (s.values[i] || 0), 0), o.dec ?? 0)}</span></div>`;
    showTip(e, `<b>${qs[i]}${o.unit ? '・' + esc(o.unit) : ''}</b>${rows}`); });
  svg.addEventListener('mouseleave', () => { hl.setAttribute('visibility', 'hidden'); hideTip(); });
}
const legend = items => `<div class="legend">${items.map(([n, c, ln]) => `<span><i class="${ln ? 'ln' : ''}" style="background:${c}"></i>${esc(n)}</span>`).join('')}</div>`;

/* ---------- common blocks ---------- */
function kpi(k, v, unit, d, src){ return `<div class="kpi"><div class="k">${esc(k)}${badge(src)}</div><div class="v">${v}${unit ? `<small>${unit}</small>` : ''}</div><div class="d">${d || '&nbsp;'}</div></div>`; }
function deltas(arr, i){ const q = chg(arr[i], arr[i-1]), y = chg(arr[i], arr[i-4]);
  return `<span class="${cls(q)}">QoQ ${pct(q)}</span>　<span class="${cls(y)}">YoY ${pct(y)}</span>`; }
function ppDelta(arr, i){ const a = arr[i], b = arr[i-1], c = arr[i-4];
  const f = (x, y) => x == null || y == null ? '—' : (x - y >= 0 ? '+' : '') + (x - y).toFixed(1) + 'pp';
  return `<span class="${cls(a-b)}">QoQ ${f(a, b)}</span>　<span class="${cls(a-c)}">YoY ${f(a, c)}</span>`; }
function panel(title, capText, body, extra=''){ return `<div class="panel"><div class="ptitle"><h3>${title}</h3>${extra}</div>${body}${capText ? `<div class="cap">${capText}</div>` : ''}</div>`; }

    lede: '在前十大候選名單之外，再加入 SK hynix 代工、DB HiTek、X-FAB、穩懋、華潤上華、宏捷科、SkyWater，市占為占 18 家合計的比重。Intel、三星口徑與前十大相同；標示「估計」的兩家不單獨揭露代工營收。'}
};
const rankQ = {top: DATA.top10.quarters.length - 1, top18: DATA.top18.quarters.length - 1};
function viewRank(id){
  const R = RANK[id], T = R.T, tq = T.quarters, i = rankQ[id];
  const rows = T.rows.map(r => ({...r, v:r.rev[i], p:i ? r.rev[i-1] : null, rk:r.rank[i], sh:r.share[i]})).sort((a, b) => a.rk - b.rk);
  const tot = T.total[i], totP = i ? T.total[i-1] : null;
  const lead = rows[0], second = rows[1], maxV = rows[0].v;
  const qbtn = tq.map((q, j) => `<button type="button" data-q="${j}" aria-pressed="${j === i}">${q}</button>`).join('');
  const table = `<div class="tscroll"><table><thead><tr><th>排名／公司</th><th>營收（百萬美元）</th><th>QoQ</th><th>市占</th><th>口徑</th></tr></thead><tbody>${
    rows.map(r => `<tr class="${r.rk > R.cut ? 'out' : ''}"><td class="name"><span class="rk">${r.rk}</span>${esc(r.label)} ${r.src === 'est' ? badge('est') : ''}</td>
      <td><span class="bar" style="width:${Math.max(2, r.v/maxV*160).toFixed(0)}px;${r.rk > R.cut ? 'background:var(--axis)' : ''}"></span>${fmt(r.v)}</td>
      <td class="${cls(chg(r.v, r.p))}">${pct(chg(r.v, r.p))}</td>
      <td>${r.sh == null ? '<span style="color:var(--muted)">未入前十</span>' : (r.sh*100).toFixed(r.sh < .01 ? 2 : 1) + '%'}</td>
      <td style="text-align:left;font-family:var(--sans);font-size:12px;color:var(--ink-2);white-space:normal;min-width:220px">${esc(r.basis)}</td></tr>`).join('')
  }</tbody></table></div>`;
  const order = T.rows.slice().sort((a, b) => b.rev[tq.length-1] - a.rev[tq.length-1]);
  const heat = `<div class="tscroll"><table class="heat"><thead><tr><th>${R.shareHead}</th>${tq.map((q, j) => `<th class="${j===i?'latest':''}">${q}</th>`).join('')}</tr></thead><tbody>${
    order.map(r => `<tr><td class="name">${esc(r.label)}</td>${r.share.map((s, j) => s == null ? `<td style="color:var(--muted)">—</td>` :
      `<td class="h" style="background:color-mix(in oklab, var(--s1) ${Math.min(85, Math.sqrt(s)*95).toFixed(0)}%, var(--surface))${s > .35 ? ';color:#fff' : ''}">${(s*100).toFixed(s < .01 ? 2 : 1)}%</td>`).join('')}</tr>`).join('')
  }<tr><td class="name">${R.tot}（百萬美元）</td>${T.total.map((v, j) => `<td class="${j===i?'latest':''}">${fmt(v)}</td>`).join('')}</tr></tbody></table></div>`;
  const fx = T.fx ? `<div>季均匯率：KRW／USD ${T.fx.KRW.map((v, j) => tq[j] + ' ' + fmt(v, 1)).join('、')}；CNY／USD ${T.fx.CNY.map((v, j) => tq[j] + ' ' + fmt(v, 3)).join('、')}。</div>` : '';
  return `<section class="view">
    <div class="head"><h2>${R.title}</h2><div class="qsel" id="qsel">${qbtn}</div></div>
    <p class="lede">${R.lede}</p>
    <div class="kpis">
      ${kpi(tq[i] + ' ' + R.tot, fmt(tot), '百萬美元', totP ? `<span class="${cls(chg(tot, totP))}">QoQ ${pct(chg(tot, totP))}</span>` : '')}
      ${kpi('第一名 ' + lead.label.split(' ')[0], (lead.sh*100).toFixed(1) + '%', '市占', `營收 ${fmt(lead.v)}`)}
      ${kpi('第二名 ' + second.label.split(' ')[0], (second.sh*100).toFixed(1) + '%', '市占', `營收 ${fmt(second.v)}`)}
      ${kpi('台積電以外合計', fmt(tot - lead.v), '百萬美元', `市占 ${((1 - lead.sh)*100).toFixed(1)}%`)}
    </div>
    ${panel(tq[i] + ' 排名', R.cut < rows.length ? '灰字為當季未進前十的候選公司。長條長度依營收比例。' : '長條長度依營收比例。', table)}
    ${panel('市占變化', '色塊深淺依市占高低。', heat)}
    <div class="note"><b>口徑與換算</b><div>${esc(T.note)}</div>${fx}</div>
  </section>`;
}
function bindRank(id){ $('#qsel').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; rankQ[id] = +b.dataset.q; render(id); }); }

/* =================== VIEW: groups =================== */
function viewGroup(key){
  const G = DATA.groups[key], S = G.series, mem = G.members;
  const col = c => css(CO_COLOR[c]);
  const name = c => DATA.companies[c].name;
  const rev = S.rev.total;
  const kp = `<div class="kpis">
    ${kpi(Q[L] + ' 合計營收', fmt(rev[L]), '百萬美元', deltas(rev, L), 'off')}
    ${kpi('季產能', fmt(S.cap.total[L]), '千片', deltas(S.cap.total, L), 'est')}
    ${kpi('產出／出貨', fmt(S.out.total[L]), '千片', deltas(S.out.total, L), 'off')}
    ${kpi('出貨／產能', fmt(S.util.total[L], 1), '%', ppDelta(S.util.total, L), 'calc')}
    ${kpi('平均 ASP', fmt(S.asp.total[L]), 'US$', deltas(S.asp.total, L), 'calc')}
    ${kpi('12 吋產能占比', fmt(S.share12.total[L], 1), '%', ppDelta(S.share12.total, L), 'calc')}
  </div>`;
  const tbl = rowsDef => `<div class="tscroll"><table><thead><tr><th>項目</th>${Q.map((q, j) => `<th class="${j===L?'latest':''}">${q}</th>`).join('')}</tr></thead><tbody>${
    rowsDef.map(([lab, arr, d, src]) => `<tr><td class="name">${esc(lab)} ${badge(src)}</td>${arr.map((v, j) => `<td class="${j===L?'latest':''}">${fmt(v, d)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  const rowsDef = [];
  for (const k of ['rev', 'cap', 'out', 'cap12', 'cap8']) {
    rowsDef.push([S[k].label + '合計（' + S[k].unit + '）', S[k].total, 0, S[k].src]);
    mem.forEach(c => { if (S[k].parts[c].some(v => v)) rowsDef.push(['　' + name(c), S[k].parts[c], 0, S[k].src]); });
  }
  rowsDef.push(['平均 ASP（US$）', S.asp.total, 0, 'calc'], ['出貨／產能（%）', S.util.total, 1, 'calc'], ['12 吋產能占比（%）', S.share12.total, 1, 'calc']);
  let extra = '';
  if (G.node) {
    const N = G.node, grp = [['7 奈米以下', [0,1,2,3]], ['10–28 奈米', [4,5,6]], ['40–90 奈米', [7,8,9]], ['0.11 微米以上', [10,11,12]]];
    const colors = ['--q1', '--q2', '--q3', '--q4'].map(css);
    const gs = grp.map(([n, idx], j) => ({name:n, color:colors[j], values:Q.map((_, i) => idx.reduce((a, k) => a + (N.pct[k][i] || 0), 0) || null)}));
    const detail = `<div class="tscroll"><table><thead><tr><th>製程（占營收 %）</th>${Q.slice(-6).map((q, j) => `<th class="${j===5?'latest':''}">${q}</th>`).join('')}</tr></thead><tbody>${
      N.labels.map((lab, k) => `<tr><td class="name">${esc(lab)}</td>${N.pct[k].slice(-6).map((v, j) => `<td class="${j===5?'latest':''}">${fmt(v, 1)}</td>`).join('')}</tr>`).join('')
    }<tr><td class="name">28 奈米及以下</td>${N.adv_pct.slice(-6).map((v, j) => `<td class="${j===5?'latest':''}">${fmt(v, 1)}</td>`).join('')}</tr></tbody></table></div>`;
    extra = `<div class="grid2">${panel('製程結構（四家合計營收占比）', '依製程分四組的 100% 堆疊；滑過看各組比重。', `${legend(gs.map(s => [s.name, s.color]))}<div class="chart" id="c-node"></div>`, badge('calc'))}
      ${panel('近六季製程明細', '四家各自揭露口徑不同，Excel 已對齊到同一組製程分類。', detail)}</div>`;
    setTimeout(() => chart($('#c-node'), {quarters:Q, type:'stack', series:gs, unit:'%', dec:1, yMax:100, label:'製程結構'}));
  }
  if (G.region) {
    const R = G.region, colors = ['--q1', '--q2', '--q3', '--q4'].map(css);
    const rs = R.labels.map((n, k) => ({name:n, color:colors[k], values:R.pct[k]}));
    const detail = `<div class="tscroll"><table><thead><tr><th>地區（占營收 %）</th>${Q.slice(-6).map((q, j) => `<th class="${j===5?'latest':''}">${q}</th>`).join('')}</tr></thead><tbody>${
      R.labels.map((lab, k) => `<tr><td class="name">${esc(lab)}</td>${R.pct[k].slice(-6).map((v, j) => `<td class="${j===5?'latest':''}">${fmt(v, 1)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    extra = `<div class="grid2">${panel('客戶地區結構（三家合計）', '中國大陸併入亞太；中芯的「中國與香港」歸亞太、「歐亞」歸歐洲。', `${legend(rs.map(s => [s.name, s.color]))}<div class="chart" id="c-reg"></div>`, badge('calc'))}
      ${panel('近六季地區明細', '', detail)}</div>`;
    setTimeout(() => chart($('#c-reg'), {quarters:Q, type:'stack', series:rs, unit:'%', dec:1, yMax:100, label:'地區結構'}));
  }
  setTimeout(() => {
    chart($('#c-rev'), {quarters:Q, type:'stack', unit:'百萬美元', label:'營收', series:mem.map(c => ({name:name(c), color:col(c), values:S.rev.parts[c]}))});
    chart($('#c-cap'), {quarters:Q, type:'stack', unit:'千片約當8吋', label:'產能', series:[{name:'6–8 吋', color:css('--q3'), values:S.cap8.total}, {name:'12 吋', color:css('--q1'), values:S.cap12.total}]});
    chart($('#c-asp'), {quarters:Q, type:'line', unit:'US$／8吋約當', label:'ASP', series:[{name:'平均 ASP', color:css('--accent'), values:S.asp.total}]});
    chart($('#c-util'), {quarters:Q, type:'line', unit:'%', dec:1, yMin:50, label:'出貨/產能', series:[{name:'出貨／產能', color:css('--accent'), values:S.util.total}]});
  });
  return `<section class="view">
    <div class="head"><h2>${G.title}</h2><div class="sub">${mem.map(name).join('、')}・${Q[0]}–${Q[L]}</div></div>
    ${kp}
    <div class="grid2">
      ${panel('營收', '各公司財報營收加總（百萬美元）。', `${legend(mem.map(c => [name(c), col(c)]))}<div class="chart" id="c-rev"></div>`, badge('off'))}
      ${panel('季產能（12 吋／6–8 吋）', '千片約當 8 吋／季；台積電與世界先進為自建逐廠模型。', `${legend([['12 吋', css('--q1')], ['6–8 吋', css('--q3')]])}<div class="chart" id="c-cap"></div>`, badge('est'))}
      ${panel('平均 ASP', '合計營收 ÷ 合計產出（美元／8 吋約當）。', `<div class="chart" id="c-asp"></div>`, badge('calc'))}
      ${panel('出貨／產能', '合計產出 ÷ 合計產能，代表整體稼動水準，不等於各公司公布的利用率。', `<div class="chart" id="c-util"></div>`, badge('calc'))}
    </div>
    ${extra}
    ${panel('完整數據', '所有數字直接取自 Excel「' + G.title + '」系列分頁。', tbl(rowsDef))}
  </section>`;
}

/* =================== VIEW: company =================== */
function viewCompany(key){
  const C = DATA.companies[key], M = C.metrics, c = css(CO_COLOR[key]);
  const g = k => M[k] ? M[k].v : null;
  const has = k => M[k] && M[k].v.some(v => v != null);
  const k = [];
  k.push(kpi(Q[L] + ' 營收', fmt(g('rev')[L]), '百萬美元', deltas(g('rev'), L), 'off'));
  k.push(kpi('毛利率', fmt(g('gm')[L], 1), '%', ppDelta(g('gm'), L), 'off'));
  k.push(kpi('營業利益率', fmt(g('opm')[L], 1), '%', ppDelta(g('opm'), L), 'off'));
  if (has('util')) k.push(kpi('產能利用率', fmt(g('util')[L], 1), '%', ppDelta(g('util'), L), M.util.src));
  k.push(kpi('ASP', fmt(g('asp')[L]), 'US$', deltas(g('asp'), L), 'calc'));
  if (has('capex')) k.push(kpi('資本支出', fmt(g('capex')[L]), '百萬美元', deltas(g('capex'), L), 'off'));
  if (has('capoff')) k.push(kpi('逐廠加總 vs 官方產能', (g('cap')[L]/g('capoff')[L]*100 - 100 >= 0 ? '+' : '') + (g('cap')[L]/g('capoff')[L]*100 - 100).toFixed(1), '%', `出貨÷利用率 vs 官方 ${pct(chg(g('capb')[L], g('capoff')[L]))}`, 'est'));
  const mixes = C.mixes.filter(mx => mx.items.some(it => it.v.slice(-6).some(v => v != null))).map(mx => {
    const qs = Q.slice(-6);
    const body = `<div class="tscroll"><table class="heat"><thead><tr><th>${esc(mx.title)}（%）</th>${qs.map((q, j) => `<th class="${j===5?'latest':''}">${q}</th>`).join('')}</tr></thead><tbody>${
      mx.items.map(it => `<tr><td class="name">${esc(it.label)}</td>${it.v.slice(-6).map(v => v == null ? '<td>—</td>' :
        `<td class="h" style="background:color-mix(in oklab, ${c} ${Math.min(55, Math.sqrt(Math.max(v, 0)/100)*60).toFixed(0)}%, var(--surface))">${fmt(v, 1)}</td>`).join('')}</tr>`).join('')
    }</tbody></table></div>`;
    return panel(mx.title, '占營收比重，官方揭露。', body, badge('off'));
  });
  const order = ['rev', 'gm', 'opm', 'cap', 'capoff', 'capb', 'ship', 'util', 'asp', 'asp2', 'capex'];
  const tbl = `<div class="tscroll"><table><thead><tr><th>指標</th>${Q.map((q, j) => `<th class="${j===L?'latest':''}">${q}</th>`).join('')}</tr></thead><tbody>${
    order.filter(has).map(m => { const d = M[m].unit === '%' ? 1 : 0;
      return `<tr><td class="name">${esc(M[m].label)}（${esc(M[m].unit)}） ${badge(M[m].src)}</td>${M[m].v.map((v, j) => `<td class="${j===L?'latest':''}">${fmt(v, d)}</td>`).join('')}</tr>`; }).join('')
  }</tbody></table></div>`;
  const capSeries = has('capoff')
    ? [{name:'逐廠加總', color:css('--q1'), values:g('cap')}, {name:'官方公布', color:css('--q3'), values:g('capoff')}, {name:'出貨÷利用率', color:css('--s2'), values:g('capb')}, {name:'出貨', color:css('--muted'), values:g('ship')}]
    : [{name:'季產能', color:css('--q3'), values:g('cap')}, {name:'出貨／產出', color:css('--q1'), values:g('ship')}];
  const aspSeries = has('asp2') ? [{name:'逐廠產能×利用率', color:c, values:g('asp')}, {name:'營收÷官方出貨', color:css('--muted'), values:g('asp2')}] : [{name:'ASP', color:c, values:g('asp')}];
  let fabPanel = '';
  if (C.fabs) {
    const n = 6, qs = Q.slice(-n), F = C.fabs;
    const row = (lab, v, d, b) => `<tr${b ? ' style="font-weight:600"' : ''}><td class="name">${esc(lab)}</td>${v.slice(-n).map((x, j) => `<td class="${j===n-1?'latest':''}">${fmt(x, d)}</td>`).join('')}</tr>`;
    fabPanel = panel('逐廠月產能（推估）', '千片／月，各廠原生晶圓尺寸；中芯不公布逐廠產能，錨點為公開的規劃產能，爬坡時點為推估。',
      `<div class="tscroll"><table><thead><tr><th>廠區（尺寸｜可信度）</th>${qs.map((q, j) => `<th class="${j===n-1?'latest':''}">${q}</th>`).join('')}</tr></thead><tbody>${
        F.rows.map(r => row(r.label, r.v, 0)).join('') + F.sub.map(r => row(r.label, r.v, 1, 1)).join('') +
        row('官方公布月產能', g('capoff').map(v => v == null ? null : v/3), 1, 1) + row('逐廠加總 vs 官方（%）', F.diff, 1)
      }</tbody></table></div>`, badge('est'));
  }
  setTimeout(() => {
    chart($('#c-crev'), {quarters:Q, type:'bar', unit:'百萬美元', label:'營收', series:[{name:'營收', color:c, values:g('rev')}]});
    chart($('#c-mg'), {quarters:Q, type:'line', unit:'%', dec:1, label:'利潤率', series:[{name:'毛利率', color:css('--q1'), values:g('gm')}, {name:'營業利益率', color:css('--q3'), values:g('opm')}]});
    chart($('#c-capship'), {quarters:Q, type:'line', unit:M.cap.unit, label:'產能與出貨', series:capSeries});
    chart($('#c-asp1'), {quarters:Q, type:'line', unit:M.asp.unit, label:'ASP', series:aspSeries});
  });
  return `<section class="view">
    <div class="head"><h2>${esc(C.name)} <span style="font-weight:500;color:var(--ink-2);font-size:18px">${esc(C.en)}</span></h2><div class="sub mono">${esc(C.ticker)}・${Q[0]}–${Q[L]}</div></div>
    <p class="lede">${esc(C.notes)}</p>
    <div class="kpis">${k.join('')}</div>
    <div class="grid2">
      ${panel('營收', '百萬美元。', `<div class="chart" id="c-crev"></div>`, badge('off'))}
      ${panel('毛利率與營業利益率', '%。', `${legend([['毛利率', css('--q1'), 1], ['營業利益率', css('--q3'), 1]])}<div class="chart" id="c-mg"></div>`, badge('off'))}
      ${panel(has('capoff') ? '季產能：三種口徑與出貨' : '季產能與出貨', esc(M.cap.unit) + '／季。' + (has('capoff') ? '逐廠加總自 1Q23 起；出貨÷利用率偏低，是因為官方利用率以產出計算、出貨少於產出。' : ''), `${legend(capSeries.map(s => [s.name, s.color, 1]))}<div class="chart" id="c-capship"></div>`, badge(M.cap.src))}
      ${panel('ASP', (has('asp2') ? '營收 ÷（逐廠季產能 × 官方利用率），自 1Q23 起；灰線為營收 ÷ 官方出貨。' : '營收 ÷ 出貨。') + '（' + esc(M.asp.unit) + '）', `${aspSeries.length > 1 ? legend(aspSeries.map(s => [s.name, s.color, 1])) : ''}<div class="chart" id="c-asp1"></div>`, badge('calc'))}
    </div>
    ${fabPanel}
    <div class="grid2">${mixes.join('')}</div>
    ${panel('完整數據', '直接取自 Excel「' + key + '」分頁。', tbl)}
  </section>`;
}

/* =================== router =================== */
const VIEWS = [['top', '全球前十大'], ['top18', '全球前十八大'], ['tw4', '台灣前四大'], ['gc3', '大中華前三'], '|', ...CO_ORDER.map(k => [k, DATA.companies[k].name])];
let cur = 'top';
function render(v){
  cur = v;
  $('#nav').querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', b.dataset.v === v));
  $('#main').innerHTML = RANK[v] ? viewRank(v) : DATA.groups[v] ? viewGroup(v) : viewCompany(v);
  if (RANK[v]) bindRank(v);
  try { localStorage.setItem('fq-view', v); } catch (e) {}
}
$('#nav').innerHTML = VIEWS.map(x => x === '|' ? '<span class="sep"></span>' : `<button type="button" role="tab" data-v="${x[0]}">${x[1]}</button>`).join('');
$('#nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { render(b.dataset.v); } });
$('#stamp').innerHTML = `最新季度 <b>${DATA.latest}</b><br>資料匯出 ${esc(DATA.generated)}`;
$('#srcfile').textContent = DATA.source;
let start = 'top';
const hv = (location.hash || '').slice(1);
try { const sv = localStorage.getItem('fq-view'); if (sv && (RANK[sv] || DATA.groups[sv] || DATA.companies[sv])) start = sv; } catch (e) {}
if (hv && (RANK[hv] || DATA.groups[hv] || DATA.companies[hv])) start = hv;
render(start);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render(cur));
new MutationObserver(() => render(cur)).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
</script>
</body>
</html>
